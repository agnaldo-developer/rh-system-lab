services:
  database:
    image: postgres:16
    container_name: rh-system-database
    restart: unless-stopped

    env_file:
      - .env.docker

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - rh-system-network

  test-database:
    image: postgres:16
    container_name: rh-system-test-database
    restart: unless-stopped

    environment:
      POSTGRES_DB: rh_system_test
      POSTGRES_USER: rh_test
      POSTGRES_PASSWORD: rh_test_password

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U rh_test -d rh_system_test
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - rh-system-network

  migrations:
    build:
      context: .
      dockerfile: Dockerfile

    image: rh-system:0.1.0
    container_name: rh-system-migrations

    env_file:
      - .env.docker

    command:
      - alembic
      - upgrade
      - head

    depends_on:
      database:
        condition: service_healthy

    networks:
      - rh-system-network

    restart: "no"

  tests:
    build:
      context: .
      dockerfile: Dockerfile

    image: rh-system:0.1.0
    container_name: rh-system-tests

    environment:
      APP_NAME: RH System API Test
      APP_ENV: test
      DATABASE_URL: >-
        postgresql+psycopg://rh_test:rh_test_password@test-database:5432/rh_system_test
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}

    command:
      - pytest
      - -v

    depends_on:
      test-database:
        condition: service_healthy

    networks:
      - rh-system-network

    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: rh-system:0.1.0
    container_name: rh-system-api
    restart: unless-stopped

    env_file:
      - .env.docker

    ports:
      - "8001:8000"

    depends_on:
      database:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

    networks:
      - rh-system-network

volumes:
  postgres_data:

networks:
  rh-system-network:
    driver: bridge