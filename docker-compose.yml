services:
  database:
    image: postgres:16
    container_name: rh-system-database
    restart: unless-stopped

    env_file:
      - .env.docker

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - rh-system-network

  api:
    build:
      context: .
      dockerfile: Dockerfile

    image: rh-system:0.1.0
    container_name: rh-system-api
    restart: unless-stopped

    env_file:
      - .env.docker

    ports:
      - "8001:8000"

    depends_on:
      database:
        condition: service_healthy

    networks:
      - rh-system-network


volumes:
  postgres_data:


networks:
  rh-system-network:
    driver: bridge
