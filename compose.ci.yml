services:
  test-database:
    image: postgres:16
    environment:
      POSTGRES_DB: rh_system_test
      POSTGRES_USER: rh_test
      POSTGRES_PASSWORD: rh_test_password

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U rh_test -d rh_system_test
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - ci-network

  tests:
    build:
      context: .
      dockerfile: Dockerfile

    environment:
      APP_NAME: RH System API Test
      APP_ENV: test
      DATABASE_URL: >-
        postgresql+psycopg://rh_test:rh_test_password@test-database:5432/rh_system_test

    command:
      - pytest
      - -v

    depends_on:
      test-database:
        condition: service_healthy

    networks:
      - ci-network

networks:
  ci-network:
    driver: bridge
